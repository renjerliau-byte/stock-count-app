<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f172a"><title>点货助手 V2.1</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:14px 12px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:23px;margin:8px 0}.pill{background:#0f172a;color:#fff;border-radius:999px;padding:7px 11px;font-weight:750;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.stat,.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0000000a}.stat{padding:14px}.num{font-size:30px;font-weight:850}.label{color:#64748b;font-size:13px}.card{padding:13px;margin:10px 0}.btn{border:0;border-radius:14px;padding:14px 15px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#0f172a;color:#fff;width:100%;font-size:18px}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.scanwrap{display:none;margin-top:10px}.scanwrap.open{display:block}#reader{overflow:hidden;border-radius:16px;background:#000;min-height:230px}.scanbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.status{padding:12px;border-radius:14px;background:#ecfdf5;color:#047857;font-weight:800;min-height:46px}.torch{display:none}.manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.manual input,.search{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:13px;font-size:16px}.notice{font-size:12px;color:#64748b;line-height:1.45;margin:9px 2px 0}.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.code{font-weight:850;word-break:break-all}.meta{color:#64748b;font-size:12px;margin-top:3px}.controls{display:flex;gap:5px;align-items:center}.qty{font-size:23px;font-weight:850;text-align:center;min-width:40px}.mini{width:39px;height:39px;border:0;border-radius:11px;background:#f1f5f9;font-size:20px;font-weight:850}.mini.del{font-size:13px;color:#991b1b;background:#fee2e2}.empty{text-align:center;color:#64748b;padding:25px 8px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid #e2e8f0;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.footerin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.flash{animation:flash .25s}@keyframes flash{50%{transform:scale(1.02);background:#d1fae5}}
</style></head><body><div class="app">
<div class="top"><h1>📦 点货助手 <small style="font-size:12px;color:#64748b">V2.1</small></h1><div class="pill" id="sessionDate"></div></div>
<div class="stats"><div class="stat"><div class="num" id="skuCount">0</div><div class="label">SKU / Barcode</div></div><div class="stat"><div class="num" id="pieceCount">0</div><div class="label">总件数</div></div></div>
<div class="card"><button class="btn primary" id="scanBtn">📷 开始连续扫描</button><div class="scanwrap" id="scanwrap"><div id="reader"></div><div class="scanbar"><div class="status" id="lastScan">把一维条码横放在扫描框内</div><button class="btn secondary torch" id="torchBtn">🔦</button></div></div><div class="manual"><input id="manualCode" inputmode="text" autocomplete="off" placeholder="手动输入 / 扫描枪输入 Barcode"><button class="btn secondary" id="addBtn">+1</button></div><p class="notice">V2.1：iPhone Safari 相机兼容修正；连续扫描，优先识别 Code 128 / EAN / UPC 等一维码。成功后会发声和震动。同一条码留在镜头前不会疯狂重复计数；移开再扫可继续 +1。</p></div>
<input class="search" id="search" placeholder="🔎 搜索 Barcode / 商品名称"><div class="card" id="list"><div class="empty">还没有点货记录。</div></div><div class="toolbar"><button class="btn secondary" id="exportBtn">⬇️ 导出 CSV</button><button class="btn danger" id="clearBtn">🗑️ 新一轮盘点</button></div></div>
<div class="footer"><div class="footerin"><button class="btn secondary" id="undoBtn">↩️ 撤销</button><button class="btn primary" id="scanBtn2">📷 连续扫描</button></div></div>
<script>
const KEY='stockCountApp_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),history=[],scanner=null,scanning=false,lastDecoded='',lastDecodedAt=0,torchOn=false,track=null;
const $=id=>document.getElementById(id);$('sessionDate').textContent=new Date().toLocaleDateString('zh-CN');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
let audioCtx=null;function feedback(){try{navigator.vibrate&&navigator.vibrate(55);const A=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new A();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=1050;g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.07);o.start();o.stop(audioCtx.currentTime+.075)}catch(e){}}
function add(code){code=(code||'').trim();if(!code)return;if(!data[code])data[code]={qty:0,name:''};data[code].qty++;history.push(code);$('lastScan').textContent='✓ '+code+'  →  '+data[code].qty+' 件';$('lastScan').classList.remove('flash');void $('lastScan').offsetWidth;$('lastScan').classList.add('flash');feedback();save()}
function change(code,d){if(!data[code])return;data[code].qty+=d;if(data[code].qty<=0)delete data[code];save()}function del(code){delete data[code];save()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=$('search').value.toLowerCase(),rows=Object.entries(data).filter(([c,v])=>c.toLowerCase().includes(q)||(v.name||'').toLowerCase().includes(q)).sort((a,b)=>b[1].qty-a[1].qty);$('skuCount').textContent=Object.keys(data).length;$('pieceCount').textContent=Object.values(data).reduce((s,v)=>s+v.qty,0);$('list').innerHTML=rows.length?rows.map(([c,v])=>`<div class="item"><div><div class="code">${esc(c)}</div><div class="meta">${v.name?esc(v.name):'未设商品名称'}</div></div><div class="controls"><button class="mini" onclick='change(${JSON.stringify(c)},-1)'>−</button><div class="qty">${v.qty}</div><button class="mini" onclick='change(${JSON.stringify(c)},1)'>+</button><button class="mini del" onclick='del(${JSON.stringify(c)})'>删除</button></div></div>`).join(''):'<div class="empty">没有记录。</div>'}
function formats(){if(!window.Html5QrcodeSupportedFormats)return undefined;const F=Html5QrcodeSupportedFormats;return [F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.ITF].filter(x=>x!==undefined)}
async function startScan(){
 if(scanning)return;
 $('scanwrap').classList.add('open');
 $('lastScan').textContent='正在启动后置相机…';
 scanner=new Html5Qrcode('reader',{formatsToSupport:formats(),verbose:false});
 // iPhone Safari 对部分 MediaTrackConstraints 较严格；避免 aspectRatio/ideal 嵌套导致启动失败。
 const config={fps:20,qrbox:(w,h)=>({width:Math.min(Math.floor(w*.92),520),height:Math.min(Math.floor(h*.38),180)}),disableFlip:true,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
 let firstError=null;
 try{
   // html5-qrcode 在 iOS Safari 最兼容的 facingMode 写法。
   await scanner.start({facingMode:'environment'},config,onDecoded,()=>{});
 }catch(e1){
   firstError=e1;
   try{
     // fallback：列出相机，优先选择名称看起来像后置/Back/Rear/Environment 的相机。
     try{scanner.clear()}catch(_){}
     scanner=new Html5Qrcode('reader',{formatsToSupport:formats(),verbose:false});
     const cams=await Html5Qrcode.getCameras();
     if(!cams||!cams.length)throw e1;
     const rear=cams.find(c=>/back|rear|environment|后置|背面/i.test(c.label))||cams[cams.length-1];
     await scanner.start(rear.id,config,onDecoded,()=>{});
   }catch(e2){
     console.error('Camera start failed',firstError,e2);
     $('lastScan').textContent='相机启动失败。请用 Safari 打开此网页并允许相机；错误：'+(e2&&e2.name?e2.name:'CameraError');
     return;
   }
 }
 scanning=true;
 $('scanBtn').textContent='⏹️ 停止扫描';$('scanBtn2').textContent='⏹️ 停止';
 $('lastScan').textContent='准备好了：把 Barcode 横放在框内';
 setTimeout(setupTorch,700);
}
function onDecoded(text){const now=Date.now();text=String(text).trim();if(!text)return;/* 同一画面持续读到同一码时，1.2秒内只计一次；实际下一件移开再回来仍可快速计数 */if(text===lastDecoded&&now-lastDecodedAt<1200)return;lastDecoded=text;lastDecodedAt=now;add(text)}
async function setupTorch(){try{const video=document.querySelector('#reader video');track=video&&video.srcObject&&video.srcObject.getVideoTracks()[0];const caps=track&&track.getCapabilities?track.getCapabilities():{};if(caps.torch)$('torchBtn').style.display='block'}catch(e){}}
async function toggleTorch(){if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});$('torchBtn').textContent=torchOn?'🔦 关灯':'🔦 开灯'}catch(e){torchOn=false}}
async function stopScan(){if(scanner&&scanning){try{await scanner.stop();scanner.clear()}catch(e){}}scanning=false;track=null;torchOn=false;$('torchBtn').style.display='none';$('scanBtn').textContent='📷 开始连续扫描';$('scanBtn2').textContent='📷 连续扫描';$('scanwrap').classList.remove('open')}
async function toggleScan(){scanning?await stopScan():await startScan()}
$('scanBtn').onclick=toggleScan;$('scanBtn2').onclick=toggleScan;$('torchBtn').onclick=toggleTorch;$('addBtn').onclick=()=>{add($('manualCode').value);$('manualCode').value='';$('manualCode').focus()};$('manualCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('addBtn').click()});$('search').oninput=render;$('undoBtn').onclick=()=>{const c=history.pop();if(c)change(c,-1)};$('clearBtn').onclick=()=>{if(confirm('确定开始新一轮盘点？目前记录会被清空。')){data={};history=[];save()}};
$('exportBtn').onclick=()=>{const rows=[['Barcode','商品名称','数量'],...Object.entries(data).map(([c,v])=>[c,v.name||'',v.qty])],csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock-count-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
